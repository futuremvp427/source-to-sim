name: NHL rehearsal segment
inputs:
  segment:
    required: true
    description: Segment identity
runs:
  using: composite
  steps:
    - name: Collect chunk 00
      id: chunk_00
      shell: bash
      run: python3 experiments/kalshi-nhl-20261014/collector.py --work data --out checkpoint --seconds 540 --segment ${{ inputs.segment }} --chunk 00
    - name: Publish chunk 00
      if: ${{ steps.chunk_00.outputs.has_checkpoint == 'true' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: nhl-checkpoint-${{ inputs.segment }}-00
        path: checkpoint/
        if-no-files-found: error
        retention-days: 5
        compression-level: 9
