name: Integrated paper segment
on:
  workflow_call:
    inputs:
      segment:
        type: number
        required: true
      slot:
        type: number
        required: true
      previous_slot:
        type: number
        required: true
    secrets:
      PMUS_DATA_KEY_ID:
        required: true
      PMUS_DATA_SECRET_KEY:
        required: true
permissions:
  contents: read
jobs:
  collect:
    if: ${{ github.repository == 'futuremvp427/source-to-sim' && github.event.repository.private == false && github.ref == 'refs/heads/research/pmus-expanded-wallet-paper-20261023' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Pinned market-data dependencies
        run: |
          python3 -m venv .venv-data
          .venv-data/bin/python -m pip install --disable-pip-version-check -r experiments/pmus-data-reliability-20261018/requirements-stream.txt
      - name: Restore the latest completed published same-run segment with immutable-byte replay
        if: ${{ inputs.segment > 0 }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          .venv-data/bin/python experiments/pmus-four-wallet-unified-20261022/run.py
          --mode recover --output paper --run-id '${{ github.run_id }}'
          --code-sha '${{ github.sha }}' --segment '${{ inputs.segment }}' --approved-paper-only
      - name: Pinned readiness checker must pass before any accounts or entry epoch
        run: >-
          .venv-data/bin/python experiments/pmus-expanded-wallet-20261023/readiness.py
          --packet experiments/pmus-four-wallet-unified-20261022/qualification/packet.json
          --evidence-root experiments/pmus-four-wallet-unified-20261022/qualification
          --expected-requirements-sha256 4b8fdb677a514c14e838f0bd94a49d9823cd1d6c0d976d54c828f9d59d4954ee
      - name: Gated paper collection, bounded US settlement drain and final evaluator
        env:
          GH_TOKEN: ${{ github.token }}
          PMUS_DATA_KEY_ID: ${{ secrets.PMUS_DATA_KEY_ID }}
          PMUS_DATA_SECRET_KEY: ${{ secrets.PMUS_DATA_SECRET_KEY }}
        run: >-
          .venv-data/bin/python experiments/pmus-four-wallet-unified-20261022/run.py
          --mode collect --output paper --run-id '${{ github.run_id }}'
          --code-sha '${{ github.sha }}' --segment '${{ inputs.segment }}'
          --seconds 18000 --approved-paper-only
