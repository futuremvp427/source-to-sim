name: Weather Lab Basis Audit

# Read-only NBM station-basis audit. Quantifies whether NOAA NBM station-text
# guidance (NBH/NBS) sits on the same measurement basis as the station
# observation, per the decision memo's Question 4. No orders, no trading.

on:
  push:
    branches: [weather-us-translation-research]
    paths:
      - scripts/weather-lab-basis-audit.ts
      - src/lib/weather-lab/sources/nbm.ts
      - .github/workflows/weather-lab-basis-audit.yml
  workflow_dispatch:
    inputs:
      days:
        description: "Calibration window length in days"
        required: false
        default: "25"

permissions:
  contents: read

jobs:
  basis-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run NBM station-basis audit
        env:
          BASIS_AUDIT_DAYS: ${{ github.event.inputs.days || '25' }}
          BASIS_AUDIT_CYCLES: "12,15,18,21"
          BASIS_AUDIT_MAX_FHR: "6"
        run: bun scripts/weather-lab-basis-audit.ts
      - name: Show report
        if: always()
        run: cat research-output/weather-lab-basis-audit.md || true
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weather-lab-basis-audit
          path: research-output/
