name: Kalshi BTC 48-hour paper study

on:
  push:
    branches: [research/kalshi-btc-paper-20261013]
    paths:
      - .github/workflows/kalshi-btc-paper-20261013.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: kalshi-btc-forward-20261013
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify simulation accounting and causality
        working-directory: experiments/kalshi-btc-20261013
        run: python3 -m unittest -v test_runner.py
      - name: Verify live public data without credentials
        run: python3 experiments/kalshi-btc-20261013/runner.py --state paper-state/state.json --output bootstrap-output --duration-seconds 60 --require-valid-samples 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: paper-state-bootstrap
          path: paper-state/state.json
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: paper-bootstrap-evidence
          path: bootstrap-output
          retention-days: 7
          if-no-files-found: warn

  collect_00:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: paper-state-bootstrap
          path: paper-state
      - name: Collect forward observations and run all frozen paper accounts
        run: python3 experiments/kalshi-btc-20261013/runner.py --state paper-state/state.json --output paper-output-00 --duration-seconds 19800
      - name: Evaluate without tuning
        run: python3 experiments/kalshi-btc-20261013/analyze.py --state paper-state/state.json --output paper-output-00/evaluation.json --raw paper-output-00/observations.jsonl.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: paper-state-00
          path: paper-state/state.json
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: paper-evidence-00
          path: paper-output-00
          retention-days: 7
          if-no-files-found: warn

