name: Four Wallet US Sports Paper 2026-10-18
on:
  push:
    branches: [research/pmus-four-wallet-paper-20261018]
    paths:
      - experiments/pmus-four-wallet-20261018/**
      - .github/workflows/pmus-four-wallet-paper-20261018.yml
permissions:
  contents: write
concurrency:
  group: pmus-four-wallet-forward-20261018-v1
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      terminal: ${{ steps.bootstrap.outputs.terminal }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Frozen accounting and integrity tests
        working-directory: experiments/pmus-four-wallet-20261018
        run: python3 -m unittest discover -v
      - name: Public-data bootstrap and durable checkpoint
        id: bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 experiments/pmus-four-wallet-20261018/collector.py --bootstrap --seconds 0 --work paper-work
  collect_00:
    needs: validate
    if: ${{ always() && needs.validate.result == 'success' && needs.validate.outputs.terminal != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    outputs:
      terminal: ${{ steps.collect.outputs.terminal }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Exact preceding checkpoint and collection segment 00
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 experiments/pmus-four-wallet-20261018/collector.py --segment 0 --seconds 18000 --work paper-work
  collect_01:
    needs: collect_00
    if: ${{ always() && needs.collect_00.result == 'success' && needs.collect_00.outputs.terminal != 'true' }}
