name: Production Schema Drift

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SCHEMA_DATABASE_URL: ${{ secrets.PRODUCTION_SCHEMA_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Production schema connection status
        if: ${{ env.SCHEMA_DATABASE_URL == '' }}
        run: echo "::warning::PRODUCTION_SCHEMA_DATABASE_URL is not configured; production drift verification is skipped"
      - name: Install PostgreSQL client
        if: ${{ env.SCHEMA_DATABASE_URL != '' }}
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Verify production schema contract
        if: ${{ env.SCHEMA_DATABASE_URL != '' }}
        run: python3 scripts/verify_schema_contract.py
