name: Production Schema Drift

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SCHEMA_DATABASE_URL: ${{ secrets.PRODUCTION_SCHEMA_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Require production schema connection
        if: ${{ env.SCHEMA_DATABASE_URL == '' }}
        run: |
          echo "::error::PRODUCTION_SCHEMA_DATABASE_URL is not configured, so production schema drift was NOT verified."
          echo "A green run here would falsely imply the production contract was checked. Configure the repository secret."
          exit 1
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Verify production schema contract
        run: python3 scripts/verify_schema_contract.py
