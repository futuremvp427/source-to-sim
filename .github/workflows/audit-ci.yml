name: Audit CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [audit/deep-hardening-20260808]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Tests
        run: bun run test
      - name: Typecheck
        run: bun ./node_modules/typescript/bin/tsc --noEmit
      - name: Production build
        run: bun run build
