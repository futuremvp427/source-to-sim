name: Audit CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [audit/deep-hardening-20260808]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Tests
        run: bun run test
      - name: Typecheck
        run: bun ./node_modules/typescript/bin/tsc --noEmit
      - name: Production build
        run: bun run build

  schema-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase
        run: supabase start
      - name: Replay migrations from a clean database
        run: supabase db reset --local
      - name: Verify safety-critical schema contract
        env:
          SCHEMA_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: python3 scripts/verify_schema_contract.py
      - name: Verify experiment-scoped event isolation
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/experiment_event_isolation.sql
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
