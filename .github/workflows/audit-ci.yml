name: Audit CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, audit/deep-hardening-20260808]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Tests
        run: bun run test
      - name: Typecheck
        run: bun ./node_modules/typescript/bin/tsc --noEmit
      - name: Production build
        run: bun run build

  schema-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase
        run: supabase start
      - name: Replay migrations from a clean database
        run: supabase db reset --local
      - name: Verify safety-critical schema contract
        env:
          SCHEMA_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: python3 scripts/verify_schema_contract.py
      - name: Verify experiment-scoped event isolation
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/experiment_event_isolation.sql
      - name: Verify pending experiment event scan semantics
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/pending_experiment_events.sql
      - name: Verify record_http_rate_limit privilege hardening
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/record_http_rate_limit_privileges.sql
      - name: Verify get_pending_experiment_source_events privilege hardening
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/pending_experiment_source_events_privileges.sql
      - name: Verify candidate shadow wallet seeds
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/candidate_shadow_wallets.sql
      - name: Verify durable paper BUY notification cursor
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/paper_buy_notification_cursor.sql
      - name: Verify reserve_http_request_slot pacing and privilege hardening
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/reserve_http_request_slot.sql
      - name: Verify Sports Forward Shadow Phase 1 schema contract (Task 12A)
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/sports_shadow_phase1.sql
      - name: Verify find_pending_sports_shadow_signals RPC semantics and privileges (Task 12B)
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/sports_shadow_pending_signals_rpc.sql
      - name: Export local Supabase connection env for the PostgREST integration harness
        run: |
          eval "$(supabase status -o env)"
          if [ -z "${API_URL:-}" ] || [ -z "${SERVICE_ROLE_KEY:-}" ]; then
            echo "::error::supabase status -o env did not produce API_URL/SERVICE_ROLE_KEY -- cannot run the Sports Shadow PostgREST integration harness."
            exit 1
          fi
          echo "SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
      - name: Verify Sports Forward Shadow real PostgREST/Supabase-JS integration (Task 12C)
        env:
          SPORTS_SHADOW_PG_INTEGRATION: "1"
        run: bun run test src/lib/sports-shadow/pg-integration.test.ts
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
